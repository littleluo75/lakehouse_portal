version: '3.8'

# ==============================================================================
# DOCKER COMPOSE: CORE ONLY (TUNED FOR MAC MINI M4 - 24GB UNIFIED MEMORY)
# ==============================================================================
# Tối ưu cho kiến trúc Apple Silicon (ARM64) và giới hạn tài nguyên tối thiểu
# Tổng RAM cấp phát cho Docker: ~4.5 GB - 5 GB (đảm bảo macOS chạy siêu mượt)
# ==============================================================================

networks:
  lakehouse-net:
    driver: bridge

volumes:
  pg-data:
  minio-data:

services:
  # ----------------------------------------------------------------------------
  # 1. POSTGRESQL (Dùng chung cho Keycloak & Nessie)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: macm4-postgres
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - lakehouse-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------------------------
  # 2. KEYCLOAK SSO (Port 8080)
  # ----------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: macm4-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password123
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      JAVA_OPTS_APPEND: "-Xms128m -Xmx512m"
    ports:
      - "8080:8080"
    volumes:
      - ../../docker-config/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      - postgres
    networks:
      lakehouse-net:
        aliases:
          - keycloak.lakehouse.local
    deploy:
      resources:
        limits:
          memory: 768M

  # ----------------------------------------------------------------------------
  # 3. MINIO OBJECT STORAGE (Port API: 9000, Console: 9001)
  # ----------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: macm4-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: 123123123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      lakehouse-net:
        aliases:
          - minio.lakehouse.local
    deploy:
      resources:
        limits:
          memory: 512M

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: macm4-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin 123123123;
      mc mb myminio/iceberg-warehouse --ignore-existing;
      exit 0;
      "
    networks:
      - lakehouse-net

  # ----------------------------------------------------------------------------
  # 4. PROJECT NESSIE (ICEBERG REST CATALOG - Port 19120)
  # ----------------------------------------------------------------------------
  nessie:
    image: ghcr.io/projectnessie/nessie:0.108.0
    container_name: macm4-nessie
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC2
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: password123
      JAVA_OPTS: "-Xms128m -Xmx384m"
    ports:
      - "19120:19120"
    depends_on:
      - postgres
    networks:
      lakehouse-net:
        aliases:
          - nessie.lakehouse.local
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------------------------
  # 5. TRINO COORDINATOR-ONLY (Port 8083)
  # ----------------------------------------------------------------------------
  trino:
    image: trinodb/trino:480
    container_name: macm4-trino
    ports:
      - "8083:8080"
    volumes:
      - ../../docker-config/trino:/etc/trino:ro
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1536M"
    depends_on:
      - nessie
      - minio-init
    networks:
      lakehouse-net:
        aliases:
          - trino.lakehouse.local
    deploy:
      resources:
        limits:
          memory: 2.5G
