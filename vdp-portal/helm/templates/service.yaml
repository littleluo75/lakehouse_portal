apiVersion: v1
kind: Service
metadata:
  name: {{ include "data-lighthouse.fullname" . }}
  labels:
    {{- include "data-lighthouse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 3000
      protocol: TCP
  selector:
    {{- include "data-lighthouse.selectorLabels" . | nindent 4 }}
