# WP-006D: LAN HTTP/HTTPS deployment for the accepted BA Draft.
# Run only via scripts/Start-BaDraftDocker.ps1, which sets BA_DRAFT_LAN_IP in
# the launcher process environment before invoking `docker compose`.
#
#   docker compose -p vdcp-ba-draft -f compose.ba-draft.yaml up -d --build

services:
  edge:
    image: caddy:2.11.4
    container_name: vdcp-ba-draft-edge
    restart: unless-stopped
    depends_on:
      portal:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "${BA_DRAFT_LAN_IP}:80:80"
      - "${BA_DRAFT_LAN_IP}:443:443"
    environment:
      BA_DRAFT_LAN_IP: "${BA_DRAFT_LAN_IP}"
    volumes:
      - ./Caddyfile.ba-draft:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ba_draft_ingress
      - ba_draft_internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    labels:
      project: "PRJ-VDCP-001"
      work-package: "WP-006D"
      mode: "ba-draft-lan-https-edge"

  portal:
    build:
      context: .
      dockerfile: Dockerfile.ba-draft
    image: vdcp-ba-draft-portal:latest
    container_name: vdcp-ba-draft-portal
    restart: unless-stopped
    environment:
      BA_DRAFT_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    networks:
      - ba_draft_internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/cp/v1/ba-control/context"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    labels:
      project: "PRJ-VDCP-001"
      work-package: "WP-006D"
      mode: "ba-draft-mock-only"

networks:
  ba_draft_ingress:
    name: vdcp-ba-draft-ingress
  ba_draft_internal:
    name: vdcp-ba-draft-internal
    internal: true

volumes:
  caddy_data:
    name: vdcp-ba-draft-caddy-data
  caddy_config:
    name: vdcp-ba-draft-caddy-config
